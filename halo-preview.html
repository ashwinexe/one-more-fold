<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Phonon screen compositions</title>
<style>body{margin:0;background:#222;display:flex;gap:20px;align-items:start}canvas{width:55vw;height:auto}canvas+canvas{width:35vw}</style>
<script type="module">
import './hero-screens.js';
const ready = setInterval(() => {
  if (!window.__phononScreens) return;
  clearInterval(ready);
  document.body.append(...Object.values(window.__phononScreens));
}, 100);
</script></html>
